name: Dev
on:
  workflow_dispatch:
jobs:
  Package:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      
      # # Add support for more platforms with QEMU (optional)
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Replace environment file
        run: |       
          # Append the secret to the .env file safely
          echo "$DEV_ENV" >> .env
        shell: bash
        env:
          DEV_ENV: ${{ secrets.DEV_ENV }}

      - name: Build and push Docker image  # Fix indentation here
        run: |
          IMAGE_TAG="ghcr.io/the-teachers-table/ttt-frontend/dev/frontend:v.0.${{ github.run_number }}"
          echo "Building Docker image with tag: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

  Dockerscout:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    needs: Package
    steps:
    - name: Checkout Git repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.TOKEN }}

    - name: Pull Docker image from GitHub Container Registry
      run: |
        IMAGE_TAG="ghcr.io/the-teachers-table/ttt-frontend/dev/frontend:v.0.${{ github.run_number }}"
        docker pull $IMAGE_TAG
        
    - name: Retag Docker image
      run: |
        SOURCE_IMAGE="ghcr.io/the-teachers-table/ttt-frontend/dev/frontend:v.0.${{ github.run_number }}"
        TARGET_IMAGE="teachertable/ttt:dev_frontend"
        docker tag $SOURCE_IMAGE $TARGET_IMAGE
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Push Docker image to Docker Hub
      run: |
        TARGET_IMAGE="teachertable/ttt:dev_frontend"
        docker push $TARGET_IMAGE
                 
  Deploy:
    if: github.ref == 'refs/heads/dev'
    needs: Dockerscout
    runs-on: ubuntu-24.04
    steps:
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh  # Secure the .ssh directory
        echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa  # Add private key from secrets
        chmod 600 ~/.ssh/id_rsa  # Ensure the private key is secure
        eval "$(ssh-agent -s)"  # Start the SSH agent
        ssh-agent sh -c 'ssh-add ~/.ssh/id_rsa'  # Add the private key to the SSH agent
         
    - name: Deploy 
      run: |
        set -e  # Exit immediately if any command fails
        
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER }} <<EOF
        set -e  # Exit immediately if any command fails
    
        # Set the CR_PAT environment variable and log in to GitHub Container Registry
        export CR_PAT="${{ secrets.TOKEN }}"
        echo \$CR_PAT | docker login ghcr.io -u ${{ secrets.GIT_USER }} --password-stdin
    
        # Stop and remove the existing container (if running)
        docker ps -q --filter "name=frontend" | xargs -r docker stop && echo "frontend stopped successfully."
        docker ps -aq --filter "name=frontend" | xargs -r docker rm -f && echo "frontend removed successfully."

        # Force remove the existing image if it exists
        docker images "ghcr.io/the-teachers-table/ttt-frontend/dev/frontend" -q | xargs -r docker rmi -f
        
        # Pull the latest version of the image
        docker pull ghcr.io/the-teachers-table/ttt-frontend/dev/frontend:v.0.${{ github.run_number }}
        
        # Start the updated container using host network
        docker run -d --name frontend --network host ghcr.io/the-teachers-table/ttt-frontend/dev/frontend:v.0.${{ github.run_number }}
    
        # Wait for the container to start
        sleep 10  # Adjust the sleep time as needed
    
        # Check if the container is running
        if ! docker ps --filter "name=frontend" --format "{{.Status}}" | grep -q "Up"; then
          echo "Container failed to start"
          exit 1
        fi

        echo "Deployment successful"
        EOF

